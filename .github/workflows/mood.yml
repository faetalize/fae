name: mood

on:
  schedule:
    - cron: "17,47 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mood:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node src/pick_mood.mjs
        env:
          # the default token only counts private work if the profile shares private contributions.
          # PROFILE_TOKEN is the fallback for profiles that don't: a token with the read:user scope.
          GITHUB_TOKEN: ${{ secrets.PROFILE_TOKEN || secrets.GITHUB_TOKEN }}
      # a single force-pushed commit on its own branch, so the count changing every 30 minutes never adds
      # to main's history. her licence travels with the image.
      - name: Publish to the output branch
        working-directory: dist
        run: |
          cp ../LICENSE-ART .
          git init -q -b output
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -q -m "Update her mood"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" output
